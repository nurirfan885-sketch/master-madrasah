<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="site-title">SISTEM TERPADU MADRASAH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .hidden { display: none; }
    .active-menu { background: #10b981 !important; color: white !important; shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2); }
    .input-field { border: 2px solid #e2e8f0; padding: 12px; border-radius: 12px; width: 100%; outline: none; transition: 0.3s; background: #ffffff; }
    .input-field:focus { border-color: #10b981; background: #f0fdf4; }
    .sidebar-item { transition: all 0.2s; color: #94a3b8; }
    .sidebar-item:hover { background: rgba(255,255,255,0.05); color: white; }
  </style>
</head>
<body class="h-full bg-slate-50 flex overflow-hidden">

  <aside id="sidebar" class="hidden md:flex flex-col w-72 bg-slate-950 h-full p-8 text-white shrink-0 border-r border-white/5">
    <div class="flex items-center gap-4 mb-12">
        <img id="side-logo" src="" class="w-12 h-12 object-contain bg-white rounded-2xl p-1.5 border border-white/10">
        <div>
            <span id="side-name" class="font-extrabold text-xs uppercase leading-tight tracking-wider block tracking-tighter">MADRASAH</span>
            <span class="text-[8px] text-emerald-500 font-bold tracking-[3px] uppercase">INTEGRATED</span>
        </div>
    </div>
    <nav class="flex-1 space-y-3">
        <button onclick="switchModule('home')" id="m-home" class="sidebar-item w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-bold text-[11px] uppercase tracking-widest active-menu">🏠 Beranda</button>
        <button onclick="switchModule('archive')" id="m-archive" class="sidebar-item w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-bold text-[11px] uppercase tracking-widest">📁 Arsip Surat</button>
        <button onclick="switchModule('ppdb')" id="m-ppdb" class="sidebar-item w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-bold text-[11px] uppercase tracking-widest">🎓 Data PPDB</button>
        <button onclick="openSettings()" class="sidebar-item w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-bold text-[11px] uppercase tracking-widest">⚙️ Pengaturan</button>
    </nav>
    <div class="pt-8 border-t border-white/10">
        <div class="bg-white/5 p-4 rounded-2xl mb-4 text-center">
            <p id="user-name" class="text-xs font-extrabold text-emerald-400 uppercase truncate"></p>
        </div>
        <button onclick="logout()" class="w-full bg-red-500/10 text-red-500 py-4 rounded-2xl font-extrabold text-[10px] hover:bg-red-500 hover:text-white transition-all border border-red-500/20 uppercase tracking-widest">Keluar</button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col h-full overflow-hidden">
    <header class="bg-white border-b h-20 flex items-center justify-between px-8 shrink-0 shadow-sm z-40">
        <div class="flex items-center gap-3 md:hidden"><img id="mobile-logo" src="" class="w-10 h-10 object-contain p-1"><span id="mobile-name" class="font-extrabold text-xs uppercase text-slate-800">MADRASAH</span></div>
        <div class="hidden md:block"><h2 id="module-title" class="font-extrabold text-slate-900 uppercase tracking-widest text-sm">Beranda Utama</h2></div>
        <div class="bg-slate-50 px-4 py-2 rounded-xl border border-slate-100"><p id="datetime" class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter"></p></div>
    </header>

    <main class="flex-1 overflow-y-auto p-5 md:p-10">
        <div id="mod-home" class="space-y-8">
            <div class="bg-emerald-700 rounded-[48px] p-10 md:p-16 text-white shadow-2xl relative overflow-hidden">
                <h1 class="text-4xl md:text-6xl font-extrabold mb-4 tracking-tighter relative z-10">Selamat Datang! 👋</h1>
                <p id="welcome-msg" class="text-emerald-100 text-sm md:text-lg max-w-2xl font-medium relative z-10 opacity-90"></p>
                <div class="absolute -bottom-10 -right-10 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-8 rounded-[32px] border border-slate-100 shadow-sm"><p class="text-[10px] font-bold text-slate-400 uppercase mb-3">Arsip Surat</p><p id="stat-surat" class="text-5xl font-extrabold text-slate-900">0</p></div>
                <div class="bg-white p-8 rounded-[32px] border border-slate-100 shadow-sm"><p class="text-[10px] font-bold text-slate-400 uppercase mb-3">Pendaftar PPDB</p><p id="stat-ppdb" class="text-5xl font-extrabold text-emerald-600">0</p></div>
            </div>
        </div>

        <div id="mod-archive" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-3xl border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                <input type="text" id="search-surat" onkeyup="filterSurat()" placeholder="Cari..." class="input-field md:max-w-md">
                <div class="flex gap-2 w-full md:w-auto">
                    <button onclick="switchTabSurat('masuk')" id="btn-s-masuk" class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-xl text-[10px] font-extrabold uppercase">MASUK</button>
                    <button onclick="switchTabSurat('keluar')" id="btn-s-keluar" class="flex-1 bg-slate-100 text-slate-500 px-6 py-3 rounded-xl text-[10px] font-extrabold uppercase">KELUAR</button>
                </div>
            </div>
            <div id="surat-list" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
        </div>

        <div id="mod-ppdb" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-3xl border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                <input type="text" id="search-ppdb" onkeyup="filterPPDB()" placeholder="Cari..." class="input-field md:max-w-md">
                <button onclick="exportPPDB()" class="w-full md:w-auto bg-emerald-600 text-white px-8 py-3 rounded-xl text-[10px] font-extrabold uppercase shadow-lg">Download Excel</button>
            </div>
            <div id="ppdb-list" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
        </div>
    </main>

    <nav class="md:hidden bg-white border-t h-20 flex items-center justify-around px-6 pb-2 shrink-0 z-50 shadow-lg">
        <button onclick="switchModule('home')" class="flex flex-col items-center gap-1.5">🏠<span class="text-[9px] font-bold">HOME</span></button>
        <button onclick="switchModule('archive')" class="flex flex-col items-center gap-1.5">📁<span class="text-[9px] font-bold">ARSIP</span></button>
        <button onclick="switchModule('ppdb')" class="flex flex-col items-center gap-1.5">🎓<span class="text-[9px] font-bold">PPDB</span></button>
        <button onclick="openSettings()" class="flex flex-col items-center gap-1.5">⚙️<span class="text-[9px] font-bold">SET</span></button>
    </nav>
  </div>

  <div id="view-login" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6">
    <div class="bg-white rounded-[48px] p-10 md:p-14 w-full max-w-md shadow-2xl text-center border-t-[12px] border-emerald-600">
        <h2 class="text-3xl font-extrabold text-slate-900 mb-2">LOGIN ADMIN</h2>
        <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[4px] mb-12">Portal Terintegrasi</p>
        <form onsubmit="handleLogin(event)" class="space-y-5">
            <input type="text" id="login-u" placeholder="Username" required class="input-field text-center font-bold">
            <input type="password" id="login-p" placeholder="••••••••" required class="input-field text-center font-bold tracking-[8px]">
            <button type="submit" class="w-full bg-emerald-600 text-white py-5 rounded-[20px] font-extrabold uppercase text-xs">MASUK DASHBOARD</button>
        </form>
        <p id="login-err" class="text-red-500 text-xs mt-6 hidden font-bold">Username atau Password Salah!</p>
    </div>
  </div>

  <div id="modal-master-settings" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-[150]">
    <div class="bg-white rounded-[40px] p-8 w-full max-w-lg shadow-2xl overflow-y-auto max-h-[90vh]">
        <h3 class="text-2xl font-extrabold text-slate-900 mb-8 uppercase">⚙️ Pengaturan</h3>
        <form onsubmit="saveMasterSettings(event)" class="space-y-6 text-xs font-bold uppercase">
            <div class="bg-emerald-50 p-6 rounded-[32px] border border-emerald-100 space-y-4">
                <input id="set-nama-sekolah" placeholder="Nama Madrasah" class="input-field" required>
                <input id="set-sub-judul" placeholder="Slogan" class="input-field" required>
                <input id="set-logo-sekolah" placeholder="URL Logo (Link PNG)" class="input-field">
            </div>
            <div class="bg-blue-50 p-6 rounded-[32px] border border-blue-100 space-y-4">
                <input id="set-nama-admin" placeholder="Nama Admin" class="input-field" required>
                <input id="set-pass-admin" type="password" placeholder="Password Baru" class="input-field">
            </div>
            <div class="flex gap-3">
                <button type="button" onclick="closeSettings()" class="flex-1 bg-slate-50 py-5 rounded-2xl">Batal</button>
                <button type="submit" class="flex-1 bg-emerald-600 text-white py-5 rounded-2xl">Simpan</button>
            </div>
        </form>
    </div>
  </div>

<script>
let appSettings = {}, dataSurat = [], dataPPDB = [], userActive = null, currentTabSurat = 'masuk';

document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/api/ppdb_settings');
        appSettings = await res.json();
        updateBrand();
    } catch(e) {}
    const saved = sessionStorage.getItem('masterUser');
    if(saved) { userActive = JSON.parse(saved); initDashboard(); }
});

function updateBrand() {
    document.getElementById('side-name').textContent = appSettings.school_name;
    document.getElementById('mobile-name').textContent = appSettings.school_name;
    document.getElementById('welcome-msg').textContent = appSettings.welcome_text;
    if(appSettings.school_logo) {
        document.getElementById('side-logo').src = appSettings.school_logo;
        document.getElementById('mobile-logo').src = appSettings.school_logo;
        document.getElementById('nav-logo').src = appSettings.school_logo;
    }
}

async function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('login-u').value, p = document.getElementById('login-p').value;
    const res = await fetch('/api/loginAkun', { method:'POST', body: JSON.stringify({u, p}) });
    if(res.ok) { sessionStorage.setItem('masterUser', JSON.stringify(await res.json())); location.reload(); }
    else { document.getElementById('login-err').classList.remove('hidden'); }
}

function switchModule(mod) {
    ['home', 'archive', 'ppdb'].forEach(m => { document.getElementById('mod-'+m).classList.add('hidden'); document.getElementById('m-'+m).classList.remove('active-menu'); });
    document.getElementById('mod-'+mod).classList.remove('hidden');
    document.getElementById('m-'+mod).classList.add('active-menu');
    document.getElementById('module-title').textContent = {'home':'Beranda Utama', 'archive':'Arsip Surat', 'ppdb':'Data PPDB'}[mod];
}

async function initDashboard() {
    document.getElementById('view-login').classList.add('hidden');
    document.getElementById('user-name').textContent = userActive.nama_lengkap;
    updateClock(); setInterval(updateClock, 1000);
    const [rs, rp] = await Promise.all([ fetch('/api/getSurat'), fetch('/api/ppdb_get') ]);
    dataSurat = await rs.json(); dataPPDB = await rp.json();
    document.getElementById('stat-surat').textContent = dataSurat.length;
    document.getElementById('stat-ppdb').textContent = dataPPDB.length;
    renderSurat(dataSurat); renderPPDB(dataPPDB);
}

function switchTabSurat(tab) {
    currentTabSurat = tab;
    document.getElementById('btn-s-masuk').className = tab === 'masuk' ? 'flex-1 bg-blue-600 text-white px-6 py-3 rounded-xl text-[10px] font-extrabold uppercase' : 'flex-1 bg-slate-100 text-slate-500 px-6 py-3 rounded-xl text-[10px] font-extrabold uppercase';
    document.getElementById('btn-s-keluar').className = tab === 'keluar' ? 'flex-1 bg-orange-500 text-white px-6 py-3 rounded-xl text-[10px] font-extrabold uppercase' : 'flex-1 bg-slate-100 text-slate-500 px-6 py-3 rounded-xl text-[10px] font-extrabold uppercase';
    renderSurat(dataSurat);
}

function renderSurat(data) {
    document.getElementById('surat-list').innerHTML = data.filter(s => s.category === currentTabSurat).map(s => `
        <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm flex flex-col h-full hover:shadow-lg transition-all">
            <p class="text-[8px] font-extrabold ${s.category==='masuk'?'text-blue-500':'text-orange-500'} uppercase mb-2 tracking-[2px]">${s.category}</p>
            <h4 class="font-extrabold text-slate-900 text-xs uppercase mb-1 leading-tight">${s.judul}</h4>
            <p class="text-[10px] text-slate-400 font-medium mb-6">${s.pengirim} | ${new Date(s.tanggal).toLocaleDateString('id-ID')}</p>
            <div class="mt-auto flex gap-2">
                ${s.file_name ? `<a href="${s.file_name}" target="_blank" class="flex-1 bg-blue-50 text-blue-600 text-center py-3 rounded-xl text-[9px] font-extrabold border border-blue-100 uppercase tracking-widest">Buka File</a>` : ''}
                <button onclick="hapusArsip('${s.id}')" class="p-3 bg-red-50 text-red-500 rounded-xl text-[10px] border border-red-100">🗑️</button>
            </div>
        </div>`).join('');
}

function renderPPDB(data) {
    document.getElementById('ppdb-list').innerHTML = data.map(s => `
        <div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm border-l-[6px] border-l-emerald-500 flex flex-col h-full hover:shadow-lg transition-all">
            <p class="text-[8px] font-extrabold text-slate-400 uppercase mb-2 tracking-[2px]">NISN: ${s.nisn}</p>
            <h4 class="font-extrabold text-emerald-900 text-xs uppercase mb-1 leading-tight">${s.nama_lengkap}</h4>
            <p class="text-[10px] text-slate-400 font-medium mb-6">${s.asal_sekolah}</p>
            <div class="mt-auto flex gap-2">
                <a href="${s.link_bukti}" target="_blank" class="flex-1 bg-emerald-50 text-emerald-700 text-center py-3 rounded-xl text-[9px] font-extrabold border border-emerald-100 uppercase tracking-widest">BUKTI PDF</a>
                <button onclick="hapusPPDB('${s.id}')" class="p-3 bg-red-50 text-red-500 rounded-xl text-[10px] border border-red-100">🗑️</button>
            </div>
        </div>`).join('');
}

function openSettings() {
    document.getElementById('set-nama-sekolah').value = appSettings.school_name;
    document.getElementById('set-sub-judul').value = appSettings.welcome_text;
    document.getElementById('set-logo-sekolah').value = appSettings.school_logo;
    document.getElementById('set-nama-admin').value = userActive.nama_lengkap;
    document.getElementById('modal-master-settings').classList.remove('hidden');
}
function closeSettings() { document.getElementById('modal-master-settings').classList.add('hidden'); }

async function saveMasterSettings(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = "SEDANG MENYIMPAN...";
    const newSet = { school_name: document.getElementById('set-nama-sekolah').value, welcome_text: document.getElementById('set-sub-judul').value, school_logo: document.getElementById('set-logo-sekolah').value };
    const userUpdate = { id: userActive.id, nama: document.getElementById('set-nama-admin').value, pass: document.getElementById('set-pass-admin').value || userActive.password };
    try {
        await Promise.all([ fetch('/api/ppdb_settings', { method:'POST', body: JSON.stringify(newSet) }), fetch('/api/updateAkun', { method:'POST', body: JSON.stringify(userUpdate) }) ]);
        alert("Pengaturan Berhasil Disimpan!"); location.reload();
    } catch (e) { alert("Gagal Simpan"); btn.disabled = false; btn.textContent = "Simpan Semua"; }
}

function updateClock() { document.getElementById('datetime').textContent = new Date().toLocaleString('id-ID', {weekday:'long', day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) + " WIB"; }
function logout() { sessionStorage.clear(); location.reload(); }
function filterSurat() { const k = document.getElementById('search-surat').value.toLowerCase(); renderSurat(dataSurat.filter(s => s.judul.toLowerCase().includes(k) || s.pengirim.toLowerCase().includes(k))); }
function filterPPDB() { const k = document.getElementById('search-ppdb').value.toLowerCase(); renderPPDB(dataPPDB.filter(s => s.nama_lengkap.toLowerCase().includes(k) || s.nisn.includes(k))); }
function exportPPDB() { const ws = XLSX.utils.json_to_sheet(dataPPDB); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Data"); XLSX.writeFile(wb, "LAPORAN_PPDB.xlsx"); }
async function hapusArsip(id) { if(confirm("Hapus?")) { await fetch('/api/deleteSurat', {method:'POST', body:JSON.stringify({id})}); initDashboard(); } }
async function hapusPPDB(id) { if(confirm("Hapus?")) { await fetch('/api/ppdb_delete', {method:'POST', body:JSON.stringify({id})}); initDashboard(); } }
</script>
</body>
</html>
